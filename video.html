<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive.infection - Videos y Tráilers</title>
    <!-- Fuente moderna estilo Gaming -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Vinculo al archivo de estilos externos -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Configuración de la imagen de fondo */
        body {
            background-image: url('fondo.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        /* Espacio superior para que el banner fijo no tape el contenido */
        .content-section {
            padding: 120px 20px 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
        }

        /* Caja contenedora del video */
        .video-card {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 71, 71, 0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
        }

        .video-card h3 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #ff4747;
            margin-bottom: 15px;
        }

        .video-card p {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        /* Contenedor del video con altura fija para expandir la caja completa */
        .video-container {
            position: relative;
            width: 100%;
            height: 480px; /* Altura de la caja */
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 71, 71, 0.4);
            background: #000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        /* Forzar al video a ocupar el 100% estirándose sin dejar espacios */
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Llena toda el área recortando ligeramente si las proporciones difieren */
            display: block;
            outline: none;
        }

        /* Ajuste responsivo para celulares */
        @media (max-width: 768px) {
            .video-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- CANVAS Y OVERLAY DE AMBIENTACIÓN -->
    <canvas id="bg-canvas"></canvas>
    <div class="ambient-overlay"></div>

    <header>
    <a href="index.html" class="logo-container">
        <img src="creepercito.jpg" alt="Logo Creepercito" class="logo-img">
        <div class="logo">Survive.infection</div>
    </a>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Reglas.html">Reglas y Metas</a></li>
            <li><a href="descargas.html">Descargas</a></li>
            <li><a href="https://discord.gg/tu-link" target="_blank">Discord</a></li>
        </ul>
    </nav>
    </header>

    <!-- SECCIÓN DE CONTENIDO Y CAJA DE VIDEO -->
    <section class="content-section">
        <h2 class="section-title">Galería Multimedia</h2>
        
        <div class="card video-card">
            <h3>🚨 Alerta de Emergencia / Tráiler del Servidor</h3>
            <p>Echa un vistazo a lo que se desata en el apocalipsis:</p>
            
            <div class="video-container">
                <!-- Reproductor local estirado para llenar todo el contenedor -->
                <video controls controlsList="nodownload" preload="metadata">
                    <source src="video.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de video en HTML5.
                </video>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Survive.infection. No afiliado con Mojang AB ni Microsoft.</p>
    </footer>

    <!-- Vinculo al archivo de JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
